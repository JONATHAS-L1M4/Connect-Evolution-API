services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app:app --host 0.0.0.0 --port 80 --proxy-headers --forwarded-allow-ips="*"
    env_file:
      - .env
    restart: always

  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    command: python scan.py
    env_file:
      - .env
    restart: always
