services:
  redis:
    image: redis:7-alpine
    restart: always
    # desliga TUDO de persistência
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  app:
    build: .
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 80
      --proxy-headers
      --forwarded-allow-ips="*"
    env_file: .env
    restart: always
    depends_on:
      - redis

  scanner:
    build: .
    command: python scan.py
    env_file: .env
    restart: always
    depends_on:
      - redis